## This can be used to reproduce the kallisto_env in order to run it on a diff. computer
## To reproduce run: conda env create -f kallisto_env.yml
name: kallisto_env
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - kallisto
  - gffread
  - fastqc
  - r-base=4.3
  - r-essentials
  - python=3.10
  - multiqc
  - bioconductor-edger
  - bioconductor-deseq2
  - bioconductor-dep
  - r-pheatmap
  - star=2.6.1b
  - bowtie2
  - subread
  - samtools
  - bioconductor-sva
  - emboss
  - kraken2
  - awscli
  - vcftools
  - bcftools
  - bedtools
  - bioconductor-pathview
  - quarto
  - bioconductor-clusterprofiler
  - bioconductor-org.ce.eg.db
  - r-targets
  - r-tarchetypes
  - openssl
  - libpng
  - cairo
  - libjpeg-turbo
  - pkg-config
  - pango
  - libxml2
  - lz4
  - pcre2
  - zstd
  - circos
  - r-snftool
  - r-mixomics
  - bioconductor-mixomics
  - bioconductor-mofa2
  - r-matrix
  - nlopt
  - r-vip
  - r-remotes
  - r-quarto
  - r-logger
  - r-testthat
  - r-ranger
  - r-plotly
prefix: /home/ozsol/miniconda3/envs/kallisto_env
