# =============================================================================
# config.yml — Metabolomics Pipeline Configuration
# =============================================================================

# -- Input --------------------------------------------------------------------
input:
  feature_matrix: "data/Level1_Compounds.v2.xlsx"   # Excel or CSV/TSV
  feature_sheet: 1                                   # sheet name/index for Excel
  annotation_columns:                                # columns to split as metadata
    - Molecule
    - HMDB
    - SMILES
    - KEGG
    - CAS
  metadata: ~                     # set to path for external CSV/TSV, or ~ to read from Excel
  metadata_sheet: "SampleSheet"   # sheet name when metadata is embedded in Excel
  sample_id_column: "SampleName"

# -- Experimental design ------------------------------------------------------
design:
  condition_column: "Year_short"
  contrasts: "2024 - 2013"
  reference_level: "2013"

# -- Normalization ------------------------------------------------------------
normalization:
  method: "metaboanalyst"         # metaboanalyst | manual
  # MetaboAnalystR parameters (used when method == metaboanalyst)
  row_norm:   "NULL"              # row normalisation: NULL, SumNorm, MedianNorm, etc.
  trans_norm: "LogNorm"           # transformation: LogNorm, SrNorm, NULL
  scale_norm: "MeanCenter"        # scaling: MeanCenter, AutoNorm, ParetoNorm, RangeNorm, NULL
  # Manual fallback parameters
  pseudocount: 1

# -- QC / Exploratory ---------------------------------------------------------
qc:
  run_pca: true
  run_correlation: true
  run_sample_heatmap: true
  top_n_variable: 50

# -- Differential Expression --------------------------------------------------
differential:
  method: "limma"                 # limma | t_test | wilcoxon
  adj_pvalue_threshold: 0.05
  log2fc_threshold: 1

# -- Random Forest ------------------------------------------------------------
rf:
  run_rf: true
  n_trees: 500
  importance: "permutation"       # permutation | impurity
  top_n: 20
  seed: 1234

# -- PLS-DA -------------------------------------------------------------------
plsda:
  run_plsda: true
  vip_top_n: 15
  colors: ["#E41A1C", "#377EB8"]           # one per group; extend for >2 groups

# -- Output -------------------------------------------------------------------
output:
  output_dir: "outputs"
  fig_width: 10
  fig_height: 8
  plot_dpi: 300
