global:
  omics_present:
  - transcriptomics
  - proteomics
  - metabolomics
  organism: c_elegans
  gene_protein_mapping: data/gene_protein_mapping.csv
  metadata: data/samples_PFOS_c_elegants.csv
  sample_id_column: sample_id
design:
  condition_column: Treatment
#condition
  design_formula: ~ Treatment
#condition
  contrasts: 1.56ppm - 0ppm

  #- treated - control
  reference_level: 0ppm
  batch_column: ~
transcriptomics:
  mode: preprocessed
  raw:
    counts_matrix: ~
    mapping_file: ~
    gmt_file: ~
  preprocessed:
    normalized_matrix: data/abundance_RNA_PFOS_c_elegants.csv
    is_log_transformed: no
    da_table: data/de_rna_PFOS_c_elegants.csv
  processing:
    min_counts: 10
    min_samples: 3
    normalization: vst
    de_method: DESeq2
proteomics:
  mode: preprocessed
  raw:
    intensity_matrix: ~
    mapping_file: ~
    contaminants_file: ~
  preprocessed:
    normalized_matrix: data/abundance_protein_PFOS_c_elegants.csv
    is_log_transformed: yes
    da_table: data/de_protein_PFOS_c_elegants.csv
  processing:
    zeros_as_na: yes
    log_transform: yes
    normalization: median
    min_presence: 0.5
    imputation: qrilc
metabolomics:
  mode: preprocessed
  raw:
    feature_matrix: 
    feature_metadata: ~
    annotation_table: ~
    pathway_mapping: ~
    gmt_file: ~
  preprocessed:
    normalized_matrix: data/abundance_metabo_PFOS_c_elegants.csv
    is_log_transformed: no
  da_table: ~
  processing:
    zeros_as_na: yes
    transform: log2
    normalization: sum_columns
    min_presence: 0.3
    imputation: qrilc
harmonization:
  sample_mode: intersection
  duplicate_strategy: keep_max_mean
feature_selection:
  transcriptomics:
    strategy: hybrid
    top_n_variance: 2000.0
    fdr_threshold: 0.05
  proteomics:
    strategy: hybrid
    top_n_variance: 1000.0
    fdr_threshold: 0.05
  metabolomics:
    strategy: hybrid
    top_n_variance: 500
    fdr_threshold: 0.05
integration:
  methods:
  - DIABLO
  - spls
  mofa2:
    num_factors: 10
    convergence_mode: fast
    seed: 42
  diablo:
    ncomp: 3
    design_matrix: full
    cv_folds: 5
    cv_repeats: 10
    min_samples_per_group: 5
  snf:
    K: 20
    alpha: 0.5
    n_clusters: 2
  spls:
    ncomp: 3
    keepX: 50
    keepY: 50
ms_helios:
  run_ms_helios: no
  compute_links: yes
  tracks:
    transcriptomics:
      scale: zscore
    proteomics:
      scale: zscore
    metabolomics:
      cluster: yes
enrichment:
  run_enrichment: yes
  methods: gsea
  ora_pvalue: 0.1
  min_set_size: 10
  max_set_size: 500
  combine_method: fisher
  use_kegg: yes
  # Multiple gene set collections for enrichment
  collections:
    - name: "GO_BP"
      type: "GO"
      ont: "BP"
    - name: "KEGG"
      type: "KEGG"
    - name: "Hallmark"
      type: "msigdbr"
      category: "H"
    - name: "Curated_Pathways"
      type: "msigdbr"
      category: "C2"
      subcategory: "CP:KEGG"
  # Top N terms to display in plots
  top_n_terms: [10, 20, 50]
  multigsea:
    run_multigsea: yes
    pvalue_threshold: 0.1
    correlation_method: pearson
output:
  output_dir: outputs
  report_format: html
  fig_width: 10
  fig_height: 8
  plot_dpi: 300
commentary:
  enabled: yes
  backend: none
  claude_model: claude-sonnet-4.5-20250514
  #claude-sonnet-4-20250514
  openai_model: gpt-4o
  max_tokens: 1500
  max_retries: 2
  retry_delay: 5
